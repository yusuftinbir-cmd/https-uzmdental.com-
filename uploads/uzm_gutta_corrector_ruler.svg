<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" fill="none">
  <defs>
    <linearGradient id="gcBg" x1="0" y1="0" x2="840" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F0ECE1"/>
    </linearGradient>
    <linearGradient id="gcBodyBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="840" height="420" rx="20" fill="url(#gcBg)"/>
  <rect x="20" y="20" width="800" height="380" rx="16" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="2"/>
  <text x="48" y="62" fill="#141413" font-family="Inter, sans-serif" font-size="19" font-weight="700">UZM DENTAL · GUTTA PERCHA CORRECTOR &amp; ENDO KALİBRASYON CETVELİ</text>
  <text x="48" y="86" fill="#8C6D46" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">ISO #20 – #140 (18 Kalibrasyon Deliği) · 30 mm Lazer Ölçek · 134°C Otoklavlanabilir Alüminyum Gövde</text>
  <!-- Cetvel Gövdesi -->
  <g transform="translate(60, 125)">
    <rect x="0" y="0" width="720" height="170" rx="22" fill="url(#gcBodyBlue)" stroke="#0F172A" stroke-width="2"/>
    <rect x="24" y="20" width="672" height="58" rx="10" fill="#172554" stroke="#60A5FA" stroke-width="1"/>

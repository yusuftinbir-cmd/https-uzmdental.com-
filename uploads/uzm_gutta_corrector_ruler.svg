      <circle cx="0" cy="0" r="4" fill="#0B0F19" stroke="#FACC15" stroke-width="2"/><text x="0" y="16">#20</text>
      <circle cx="52" cy="0" r="4.5" fill="#0B0F19" stroke="#EF4444" stroke-width="2"/><text x="52" y="16">#25</text>
      <circle cx="104" cy="0" r="5" fill="#0B0F19" stroke="#3B82F6" stroke-width="2"/><text x="104" y="16">#30</text>
      <circle cx="156" cy="0" r="5.5" fill="#0B0F19" stroke="#22C55E" stroke-width="2"/><text x="156" y="16">#35</text>
      <circle cx="208" cy="0" r="6" fill="#0B0F19" stroke="#141413" stroke-width="2"/><text x="208" y="16">#40</text>
      <circle cx="260" cy="0" r="6.5" fill="#0B0F19" stroke="#FFFFFF" stroke-width="2"/><text x="260" y="16">#45</text>
      <circle cx="312" cy="0" r="7" fill="#0B0F19" stroke="#FACC15" stroke-width="2"/><text x="312" y="16">#50</text>
      <circle cx="364" cy="0" r="7.5" fill="#0B0F19" stroke="#EF4444" stroke-width="2"/><text x="364" y="16">#55</text>
      <circle cx="416" cy="0" r="8" fill="#0B0F19" stroke="#3B82F6" stroke-width="2"/><text x="416" y="16">#60</text>
      <circle cx="468" cy="0" r="8.5" fill="#0B0F19" stroke="#22C55E" stroke-width="2"/><text x="468" y="16">#70</text>
      <circle cx="520" cy="0" r="9" fill="#0B0F19" stroke="#141413" stroke-width="2"/><text x="520" y="16">#80</text>
      <circle cx="575" cy="0" r="10" fill="#0B0F19" stroke="#93C5FD" stroke-width="2"/><text x="575" y="16">#90–140</text>

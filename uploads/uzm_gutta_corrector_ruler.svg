    <!-- 30mm Lazer Cetvel Skala Kanalı -->
    <rect x="24" y="102" width="672" height="48" rx="8" fill="#0F172A" stroke="#93C5FD" stroke-width="1"/>
    <text x="42" y="122" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">0 mm         5 mm         10 mm        15 mm        20 mm        25 mm        30 mm (LAZER ÖLÇEK &amp; KESİM OLUĞU)</text>
